services:
  mariadb:
    image: mariadb:11.1-jammy
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --default-time-zone=Europe/Saratov
    volumes:
      - /mnt/zm_data/ZM_DATA/db:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=w8t67u23789t
      - MARIADB_USER=zmuser
      - MARIADB_PASSWORD=zmpass
      - MARIADB_DATABASE=zm
      - TZ=Europe/Saratov
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  zm:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: zhadaevfm/docker-zoneminder
    restart: always
    shm_size: 8G
    ports:
      - 8081:80
    depends_on:
      mariadb:
        condition: service_healthy
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /mnt/zm_data/ZM_DATA/zmcache:/var/cache/zoneminder
      - /mnt/zm_data/ZM_DATA/zmlog:/var/log/zm
      - /mnt/zm_data/ZM_DATA/zmapachelog:/var/log/apache2
      - ./data/es_rules.json:/etc/zm/es_rules.json
      - ./data/secrets.ini:/etc/zm/secrets.ini
      - ./data/zmeventnotification.ini:/etc/zm/zmeventnotification.ini
      - ./data/objectconfig.ini:/etc/zm/objectconfig.ini
    environment:
      - ZM_DB_HOST=mariadb
      - ZM_DB_PASS=zmpass
      - ZM_DB_NAME=zm
      - ZM_DB_USER=zmuser
      - TZ=Europe/Saratov

